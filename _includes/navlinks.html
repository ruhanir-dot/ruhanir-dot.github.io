<nav class="post-navi">
  {%- if page.previous.url %}
  <a class="post-navi-item nav-prev" href="{{ page.previous.url | relative_url }}">
    <span class="post-navi-label">&lt; previous</span>
    <span class="post-navi-title">{{ page.previous.title | escape }}</span>
  </a>
  {%- else %}
  <a class="post-navi-item nav-prev" href="{{ '/archive.html' | relative_url }}">
    <span class="post-navi-label">&lt; archive</span>
    <span class="post-navi-title">All previous posts</span>
  </a>
  {%- endif %}

  {%- if page.next.url %}
  <a class="post-navi-item nav-next" href="{{ page.next.url | relative_url }}">
    <span class="post-navi-label">next &gt;</span>
    <span class="post-navi-title">{{ page.next.title | escape }}</span>
  </a>
  {%- else %}
  <a class="post-navi-item nav-next" href="{{ '/archive.html' | relative_url }}">
    <span class="post-navi-label">archive &gt;</span>
    <span class="post-navi-title">All previous posts</span>
  </a>
  {%- endif %}
</nav>
